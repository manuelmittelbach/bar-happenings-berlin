<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Inside Bars</title>
    <meta name="description" content="Find live music, quiz nights, open mics, and community events in small independent bars across Berlin.">
    <meta name="author" content="Inside Bars" />
    <meta name="theme-color" content="#0F0F0F" />
    <!-- Warm the connection to the map tile CDN before MapPage mounts, so the
         first style/tile request skips the TCP+TLS handshake. crossorigin
         because MapLibre fetches tiles with CORS; dns-prefetch is the fallback
         for browsers that ignore preconnect. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <link rel="canonical" href="https://insidebars.co/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://insidebars.co/" />
    <meta property="og:site_name" content="Inside Bars" />
    <meta property="og:title" content="Inside Bars — Discover events in Berlin bars" />
    <meta property="og:description" content="Find live music, quiz nights, open mics, and community events in small independent bars across Berlin." />
    <meta property="og:image" content="https://insidebars.co/og-image.png?v=5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Inside Bars — What's on tonight in Berlin bars?" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inside Bars — Discover events in Berlin bars" />
    <meta name="twitter:description" content="Find live music, quiz nights, open mics, and community events in small independent bars across Berlin." />
    <meta name="twitter:image" content="https://insidebars.co/og-image.png?v=5" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
